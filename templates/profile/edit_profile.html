<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - BiteMetrics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='edit_profile.css') }}">

</head>


<body class="edit-profile-page">


    <div class="edit-profile-wrapper">


        <!-- BACK BUTTON -->

        <a href="{{ url_for('home') }}"
           class="back-dashboard">

            ← Back to Dashboard

        </a>



        <!-- PROFILE CARD -->

        <div class="edit-profile-card">


            <!-- HEADER -->

            <div class="edit-profile-header">

                <div class="edit-avatar">
                    👤
                </div>

                <div>

                    <h1>Edit Profile</h1>

                    <p>
                        Update your BiteMetrics account information
                    </p>

                </div>

            </div>



            <div class="edit-divider"></div>



            <!-- FORM -->

            <form method="POST">


                <!-- USERNAME -->

                <div class="edit-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        value="{{ username }}"
                        placeholder="Enter username"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="edit-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="edit-form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                    >

                    <small>
                        Leave blank if you don't want to change your password.
                    </small>

                </div>



                <!-- BUTTONS -->

                <div class="edit-profile-actions">

                    <a href="{{ url_for('home') }}"
                       class="edit-cancel-btn">

                        Cancel

                    </a>


                    <button type="submit"
                            class="edit-save-btn">

                        Save Changes

                    </button>

                </div>


            </form>


        </div>


    </div>


</body>

</html>
